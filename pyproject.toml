[project]
name = "night-light-by-ht"
version = "0.2.0"
description = "A compact, transparent Windows evening-light controller by HassTech."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "HassTech" },
]
keywords = ["windows", "night-light", "circadian", "display", "accessibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = [
  "customtkinter>=5.2,<6",
  "Pillow>=10,<13",
  "tzdata==2026.3",
  "tzlocal==5.4.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pyinstaller>=6.10,<7",
]

[tool.setuptools]
py-modules = [
  "build",
  "build_identity",
  "build_installer",
  "build_premium",
  "premium_ui",
  "config_manager",
  "config_paths",
  "create_shortcuts",
  "display_status",
  "hud_overlay",
  "icons",
  "main",
  "nightlight_engine",
  "release",
  "smart_mode",
  "smart_time",
  "smart_transition",
  "smart_schedule",
  "smart_state",
  "smart_runtime",
  "smart_store",
  "smart_desktop",
  "smart_migration",
  "smart_migration_switch",
  "private_config_files",
  "smart_ui",
  "smart_learning",
  "smart_location",
  "smart_windows",
  "tray_app",
  "win32_tray",
  "windows_nightlight",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["."]
python_files = ["test_*.py"]
# Historical audit sandboxes contain older source/test copies. Keep them as
# evidence, but never discover them as the current application's test suite.
norecursedirs = ["audit", ".*", "build", "dist", "node_modules", "venv", "*.egg", "_darcs", "CVS", "{arch}"]
