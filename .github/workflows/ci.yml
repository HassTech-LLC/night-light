name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NIGHT_LIGHT_BY_HT_DISABLE_DISPLAY_BACKEND: "1"
      NIGHT_LIGHT_BY_HT_CONFIG_DIR: ${{ runner.temp }}\night-light-by-ht-test-state

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Build Windows bundle
        run: python build.py

      - name: Upload unsigned development bundle
        uses: actions/upload-artifact@v7
        with:
          name: night-light-by-ht-windows-unsigned
          path: dist/
          if-no-files-found: error

